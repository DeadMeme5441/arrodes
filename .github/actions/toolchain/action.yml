name: Arrodes toolchain
description: Pinned Java, Clojure and Bun with dependency caches
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: '21.0.12+101.0.LTS'
    - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.5.1654'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.3.14'
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('deps.edn', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-deps-
    - shell: bash
      run: bun install --frozen-lockfile
