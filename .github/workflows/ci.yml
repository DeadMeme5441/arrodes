name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification or corresponding-source preparation
        type: choice
        options: [verify, sources]
        default: verify
permissions:
  contents: read
jobs:
  verify:
    if: inputs.scope != 'sources'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ARRODES_TEST_OFFLINE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: '1.12.5.1654'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned terminal dependencies
        run: bun install --frozen-lockfile
      - name: Check repository privacy
        run: python scripts/check-private.py
      - name: Check behavioral invariants
        run: clojure -Srepro -M:test
      - name: Verify native TUI and controller
        run: bun run test:tui
      - name: Exercise source RPC
        run: python scripts/verify-rpc.py
      - name: Build self-contained executable
        run: bun run release
      - name: Install terminal smoke tooling
        run: python -m pip install -r scripts/requirements-verify.txt
      - name: Exercise installed executable without developer tools
        run: python scripts/verify-release.py --directory target/release
      - name: Package headless SDK
        run: clojure -Srepro -T:build uber
      - uses: actions/upload-artifact@v4
        with:
          name: arrodes-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  sources:
    name: Package corresponding sources
    if: startsWith(github.ref, 'refs/tags/v') || inputs.scope == 'sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package corresponding third-party sources
        run: python scripts/package-source-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: arrodes-source-materials
          path: |
            target/release/arrodes-third-party-sources.tar.gz
            target/release/arrodes-third-party-sources.tar.gz.sha256
            target/release/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          compression-level: 0
  release:
    name: Stage verified release
    needs: [verify, sources]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'DeadMeme5441/arrodes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: arrodes-*
          path: target/release
          merge-multiple: true
      - name: Stage verified executables, notices, and sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py
