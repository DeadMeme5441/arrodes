name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'windows' }}
    timeout-minutes: 45
    env:
      ARRODES_TEST_OFFLINE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: '1.12.5.1654'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned terminal dependencies
        run: bun install --frozen-lockfile
      - name: Check repository privacy
        run: python scripts/check-private.py
      - name: Check behavioral invariants
        run: clojure -Srepro -M:test
      - name: Verify native TUI and controller
        run: bun run test:tui
      - name: Exercise source RPC
        run: python scripts/verify-rpc.py
      - name: Build self-contained executable
        run: bun run release
      - name: Install terminal smoke tooling
        run: python -m pip install -r scripts/requirements-verify.txt
      - name: Exercise installed executable without developer tools
        run: python scripts/verify-release.py --directory target/release
      - name: Package headless SDK
        run: clojure -Srepro -T:build uber
      - uses: actions/upload-artifact@v4
        with:
          name: arrodes-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    name: Stage private draft release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: arrodes-*
          path: target/release
          merge-multiple: true
      - name: Stage verified artifacts without changing repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py
